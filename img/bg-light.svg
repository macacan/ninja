<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- Bakgrundsmönster för ljust läge (samma som bg-dark.svg, mörka linjer): tunna linjeteckningar som upprepas. Milt, så att innehållet syns först.
       Motiven ligger minst 30 px från kanterna, så att skarvarna inte syns när mönstret upprepas. -->

  <!-- Små prickar som ger lite textur mellan motiven -->
  <g fill="#3a4a7a" fill-opacity=".10">
    <circle cx="128" cy="40" r="1.6"/><circle cx="214" cy="96" r="1.2"/><circle cx="404" cy="40" r="1.4"/>
    <circle cx="34" cy="166" r="1.2"/><circle cx="330" cy="164" r="1.6"/><circle cx="118" cy="214" r="1.2"/>
    <circle cx="452" cy="330" r="1.2"/><circle cx="206" cy="372" r="1.6"/><circle cx="40" cy="350" r="1.4"/>
    <circle cx="360" cy="452" r="1.2"/><circle cx="160" cy="452" r="1.4"/><circle cx="274" cy="292" r="1.2"/>
  </g>

  <g fill="none" stroke="#3a4a7a" stroke-opacity=".07" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <!-- Boll -->
    <g transform="translate(70 80) rotate(-18)">
      <circle r="26"/>
      <path d="M-26 0H-8M8 0H26"/>
      <circle r="8"/>
      <circle r="3"/>
    </g>
    <!-- Litet spöke -->
    <g transform="translate(332 74)">
      <path d="M-20 26V-2a20 20 0 0 1 40 0v28l-7-6-6.5 6-6.5-6-6.5 6-6.5-6z"/>
      <circle cx="-7" cy="-2" r="2.5"/>
      <circle cx="7" cy="-2" r="2.5"/>
    </g>
    <!-- Blixt -->
    <path d="M430 128l-18 26h14l-10 24 22-30h-14l8-20z"/>
    <!-- Boosterpaket -->
    <g transform="translate(236 206) rotate(9)">
      <path d="M-20 -34h40l-3 4 3 4v52l-3 4 3 4h-40l3-4-3-4v-52l3-4z"/>
      <path d="M-11 -10h22M-11 -2h15"/>
      <path d="M-20 18h40"/>
    </g>
    <!-- Kort med stjärna i bildrutan -->
    <g transform="translate(130 306) rotate(-12)">
      <rect x="-22" y="-30" width="44" height="60" rx="4"/>
      <rect x="-15" y="-23" width="30" height="24" rx="2"/>
      <path d="M0 -17.5l2 4.2 4.6.6-3.4 3.2.9 4.5L0 -7.2l-4.1 2.3.9-4.5-3.4-3.2 4.6-.6z"/>
      <path d="M-15 9H15M-15 16H7M-15 23H2"/>
    </g>
    <!-- Kortbunt -->
    <g transform="translate(398 300) rotate(14)">
      <rect x="-16" y="-22" width="32" height="44" rx="3"/>
      <path d="M-12 -26h28a3 3 0 0 1 3 3v40"/>
      <path d="M-8 -30h28a3 3 0 0 1 3 3v40"/>
    </g>
    <!-- Liten kattlik figur -->
    <g transform="translate(284 392)">
      <path d="M-22 -6l-4-22 16 10a24 24 0 0 1 20 0l16-10-4 22a24 22 0 1 1-44 0z"/>
      <circle cx="-8" cy="2" r="2.5"/>
      <circle cx="8" cy="2" r="2.5"/>
      <path d="M-5 11q5 4 10 0"/>
    </g>
    <!-- Liten boll -->
    <g transform="translate(60 418) rotate(24)">
      <circle r="15"/>
      <path d="M-15 0H-5M5 0H15"/>
      <circle r="5"/>
    </g>
    <!-- Gnistor -->
    <path d="M186 150l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
    <path d="M40 252l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <path d="M444 410l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
  </g>

  <!-- Några få motiv i varm ton, för lite liv -->
  <g fill="none" stroke="#f2b632" stroke-opacity=".075" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mynt -->
    <g transform="translate(208 52)">
      <circle r="13"/>
      <circle r="8.5"/>
    </g>
    <!-- Stjärna -->
    <path d="M436 216l3.5 7.5 8 1-6 5.5 1.6 8-7.1-4-7.1 4 1.6-8-6-5.5 8-1z"/>
    <!-- Gnista -->
    <path d="M196 440l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
  </g>
  <g fill="none" stroke="#ff7a6b" stroke-opacity=".07" stroke-width="1.75" stroke-linecap="round">
    <!-- Liten boll i röd ton -->
    <g transform="translate(330 250) rotate(-30)">
      <circle r="12"/>
      <path d="M-12 0H-4M4 0H12"/>
      <circle r="4"/>
    </g>
  </g>
</svg>
