name: Butiksbevakning

# GitHub startar schemalagda jobb högst några gånger per dygn för det här repot, oavsett vad cron säger.
# Därför kör jobbet i stället daemon.mjs (var 15:e minut per butik) i nästan sex timmar, hämtar nyheter och
# sparar till repot var 15:e minut och startar sedan nästa körning själv. Schemat nedan är bara en reserv som startar
# kedjan igen om den skulle brytas (t.ex. om GitHub avbryter ett jobb).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # för att kunna starta nästa körning i kedjan

# Två körningar får aldrig överlappa, annars skulle butikerna få dubbelt så många anrop.
# En reservkörning som startas medan kedjan går väntar i kön och blir sedan nästa länk.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    # Kör du daemon.mjs på en egen dator: sätt repo-variabeln SCRAPE_ON_ACTIONS=false, annars
    # bevakas butikerna dubbelt och samma notis skickas två gånger.
    if: vars.SCRAPE_ON_ACTIONS != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      DAEMON_MINUTES: ${{ vars.SCRAPE_DAEMON_MINUTES || 330 }}
      # Var 15:e minut: samma takt som butikerna kollas, så att sidan ligger högst en kvart efter.
      COMMIT_EVERY: ${{ vars.SCRAPE_COMMIT_MINUTES || 15 }}
      DAEMON_INTERVAL: ${{ vars.SCRAPE_INTERVAL_MINUTES || 15 }}
      DAEMON_PAGES: 25 # sitemap-butiker: fler produktsidor per varv när varven är glesare
      # Skrivtoken för de reserverade ntfy-ämnena (repo-secret). Saknas den skickas notiserna utan inloggning.
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Bevakningens minne (state.json, 2 MB) sparas i Actions-cachen i stället för i repot. Det stod för
      # ungefär två tredjedelar av repots tillväxt. Saknas cachen används filen som ligger i repot.
      - name: Hämta bevakningens minne
        uses: actions/cache/restore@v4
        with:
          path: scripts/scraper/state.json
          key: scrape-state-${{ github.run_id }}
          restore-keys: scrape-state-
      - name: Bevaka butikerna och hämta nyheter
        run: |
          git config user.name "packninja-bot"
          git config user.email "packninja-bot@users.noreply.github.com"
          FILES="data/news.json data/release-calendar.json data/products.json data/events.json data/stores-status.json data/notify.json data/price-history.json"
          save() {
            node scripts/update-news.mjs || echo "::warning::Nyheterna kunde inte hämtas den här gången"
            node scripts/update-releases.mjs || echo "::warning::Släppkalendern kunde inte uppdateras den här gången"
            git add $FILES
            git diff --cached --quiet && return 0
            git commit -q -m "Uppdatera butikslager och nyheter"
            # Daemonen skriver filerna hela tiden, så ändringar som kommer under tiden läggs undan och tillbaka.
            # Krockar det (t.ex. news.json från nyhetsjobbet) vinner vår nyare version.
            for i in 1 2 3; do
              git pull -q --rebase --autostash -X theirs && git push -q && return 0
              git rebase --abort 2>/dev/null
              sleep 10
            done
            echo "::warning::Kunde inte spara till repot, försöker igen nästa gång"
          }

          node scripts/scraper/daemon.mjs &
          PID=$!
          while kill -0 $PID 2>/dev/null; do
            for _ in $(seq $((COMMIT_EVERY * 6))); do kill -0 $PID 2>/dev/null || break; sleep 10; done
            save
          done
          wait $PID || echo "::warning::Bevakningen avslutades med fel"
          save
      - name: Spara bevakningens minne
        if: always() && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: scripts/scraper/state.json
          key: scrape-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Starta nästa körning
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scrape.yml --ref "${{ github.ref_name }}"
