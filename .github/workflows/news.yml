name: Uppdatera nyheter

on:
  schedule:
    - cron: "17 * * * *" # varje timme (nyheterna hämtas också varje timme av Butiksbevakning, det här är en reserv)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-news.mjs
      - run: node scripts/update-set-logos.mjs || echo "Setloggorna kunde inte uppdateras den här gången"
      - run: node scripts/update-releases.mjs || echo "Släppkalendern kunde inte uppdateras den här gången"
      - name: Spara om något ändrats
        run: |
          git config user.name "packninja-bot"
          git config user.email "packninja-bot@users.noreply.github.com"
          git add data/news.json data/set-logos.json data/release-calendar.json
          git diff --cached --quiet || (git commit -m "Uppdatera nyheter" && git pull --rebase -X theirs && git push)
