name: Korttrender

on:
  schedule:
    - cron: "40 5 * * *" # varje morgon, efter att Cardmarkets priser uppdaterats
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-card-trends.mjs
      # Nya Pokémon och populära kort till sökförslagen (pokemon-names.json).
      - run: node scripts/build-pokemon-names.mjs || echo "Pokémonnamnen kunde inte uppdateras den här gången"
      - name: Spara om något ändrats
        run: |
          git config user.name "ninjaloot-bot"
          git config user.email "ninjaloot-bot@users.noreply.github.com"
          git add data/card-trends.json data/card-history data/pokemon-names.json
          git diff --cached --quiet || (git commit -m "Uppdatera korttrender" && git pull --rebase && git push)
