name: Korttrender

on:
  schedule:
    - cron: "40 5 * * *" # varje morgon, efter att Cardmarkets priser uppdaterats
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-card-trends.mjs
      # One Piece-korten till Kortpriser (priser.html?game=op): kort, TCGplayer-priser och egen prishistorik.
      - run: node scripts/update-op-cards.mjs || echo "One Piece-korten kunde inte uppdateras den här gången"
      # Riftbound-korten (priser.html?game=rb) från TCGplayer via tcgcsv.com, med Riots bilder från Riftcodex.
      - run: node scripts/update-rb-cards.mjs || echo "Riftbound-korten kunde inte uppdateras den här gången"
      # Nya Pokémon och populära kort till sökförslagen (pokemon-names.json).
      - run: node scripts/build-pokemon-names.mjs || echo "Pokémonnamnen kunde inte uppdateras den här gången"
      # Antal boosterpaket per produkt från Bulbapedia, för pris per booster på butikssidan.
      - run: node scripts/update-product-contents.mjs || echo "Produktinnehållet kunde inte uppdateras den här gången"
      # Alla set och kortlistor till setsidorna (data/sets/), sedan sidorna själva och sitemapen.
      - run: node scripts/update-sets.mjs || echo "Seten kunde inte hämtas den här gången"
      # Kortbilder som TCGdex saknar (Pokémon TCG API, sedan TCGplayer via tcgcsv.com).
      - run: node scripts/update-card-images.mjs || echo "Kortbilderna kunde inte uppdateras den här gången"
      - run: node scripts/build-set-pages.mjs
      - run: node scripts/build-sitemap.mjs --ping || echo "IndexNow kunde inte pingas den här gången"
      - name: Spara om något ändrats
        run: |
          git config user.name "packninja-bot"
          git config user.email "packninja-bot@users.noreply.github.com"
          git add data/card-trends.json data/card-history data/op data/rb data/pokemon-names.json data/product-contents.json data/sets data/set-pages.json data/card-images.json set sitemap.xml scripts/sitemap-state.json
          git diff --cached --quiet || (git commit -m "Uppdatera korttrender och setsidor" && git pull --rebase -X theirs && git push)
